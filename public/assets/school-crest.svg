<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nuuyoma Senior Secondary School crest</title>
  <desc id="desc">Circular school crest with an open book, rising sun and the letters NSSS.</desc>
  <defs>
    <path id="arc-top" d="M 96 256 A 160 160 0 0 1 416 256" fill="none"/>
    <path id="arc-bottom" d="M 416 256 A 160 160 0 0 1 96 256" fill="none"/>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a6c5e"/>
      <stop offset="1" stop-color="#004a41"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cf6a"/>
      <stop offset="1" stop-color="#d9a52f"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="252" fill="#17263a"/>
  <circle cx="256" cy="256" r="238" fill="#fffaf3"/>
  <circle cx="256" cy="256" r="226" fill="url(#teal)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <text font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="5.2" fill="#fff7e6">
