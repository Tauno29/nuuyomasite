  <g>
    <path d="M 256 232 C 232 218 196 216 172 224 L 172 312 C 196 304 232 306 256 322 Z" fill="#fffaf3"/>
    <path d="M 256 232 C 280 218 316 216 340 224 L 340 312 C 316 304 280 306 256 322 Z" fill="#fff3dc"/>
