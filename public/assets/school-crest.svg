      <line x1="204" y1="135" x2="214" y2="150"/>
      <line x1="308" y1="135" x2="298" y2="150"/>
      <line x1="180" y1="184" x2="197" y2="188"/>
      <line x1="332" y1="184" x2="315" y2="188"/>
